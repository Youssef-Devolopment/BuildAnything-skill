# CI: lint + typecheck + tests on every push and PR (BuildAnything GitHub-native rule).
# Node profile — for other stacks swap the run steps (pytest, go test, …), keep the structure.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm        # change to pnpm/yarn/bun to match the lockfile

      - name: Install (locked)
        run: npm ci         # fails if package-lock.json is out of sync — by design

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Test
        run: npm test --if-present
